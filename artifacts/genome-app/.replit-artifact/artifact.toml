kind = "web"
previewPath = "/genome-app/"
title = "Belief Genome — Web App"
version = "1.0.0"
id = "artifacts/genome-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/genome-app/" ]
localPort = 22386

[services.development]
run = "pnpm --filter @workspace/genome-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/genome-app", "run", "build" ]
publicDir = "artifacts/genome-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22386"
BASE_PATH = "/genome-app/"
