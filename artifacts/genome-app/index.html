<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Belief Genome — Web App</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph / social share metadata. The image is a static, generic
         card; per-DNA dynamic OG images are deferred to a later phase. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Belief Genome Project" />
    <meta property="og:title" content="Belief Genome Project" />
    <meta property="og:description" content="124 belief dimensions, mapped. See your Belief DNA." />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Belief Genome Project" />
    <meta name="twitter:description" content="124 belief dimensions, mapped. See your Belief DNA." />
    <meta name="twitter:image" content="/og-default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // First-paint theme bootstrap — see whoo-ru/index.html for full notes.
      (function () {
        try {
          var t = localStorage.getItem("bgpTheme");
          // Default must match the current admin-set activeTheme in the DB
          // (see api-server/src/routes/settings.ts) so first-time visitors
          // (no localStorage yet) don't see a dark→light flash when
          // useThemeBootstrap later fetches /api/theme on mount.
          document.documentElement.dataset.theme = (t === "light" || t === "dark") ? t : "light";
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
