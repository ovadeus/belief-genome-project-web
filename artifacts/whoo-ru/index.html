<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="A systematic exploration of human belief. The Belief Genome Project maps the polarized beliefs humans hold at both micro and macro scales, and the shifting patterns that forecast into the future." />
    <meta name="author" content="David Edwin Meyers" />
    <title>Belief Genome Project</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <script>
      // First-paint theme bootstrap. Reads the cached theme written on the
      // previous visit so the page renders in the correct palette before React
      // mounts. The useThemeBootstrap hook in App.tsx then refreshes from the
      // server on mount, so an admin's change propagates within one full load.
      (function () {
        try {
          var url = new URLSearchParams(window.location.search);
          var override = url.get("theme");
          if (override === "light" || override === "dark") {
            document.documentElement.dataset.theme = override;
            localStorage.setItem("bgpTheme", override);
            return;
          }
          var t = localStorage.getItem("bgpTheme");
          // Default must match the current admin-set activeTheme in the DB
          // (see api-server/src/routes/settings.ts) so first-time visitors
          // (no localStorage yet) don't see a dark→light flash when
          // useThemeBootstrap later fetches /api/theme on mount.
          document.documentElement.dataset.theme = (t === "light" || t === "dark") ? t : "light";
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
