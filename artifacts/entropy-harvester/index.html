<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Entropy Harvester — a survey instrument that preserves superposition. By the Belief Genome Project." />
    <meta name="author" content="David Edwin Meyers" />
    <title>Entropy Harvester</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // First-paint theme bootstrap. Mirrors the BGP convention used in
      // whoo-ru: read the cached theme so the page renders in the correct
      // palette before React mounts. Defaults to "dark".
      (function () {
        try {
          var t = localStorage.getItem("bgpTheme");
          document.documentElement.dataset.theme = (t === "light" || t === "dark") ? t : "dark";
        } catch (_) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
